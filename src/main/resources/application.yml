server:
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: /

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: storage-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/storagedb}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Shared / non-empty DBs (e.g. Neon): baseline-on-migrate inserts baseline at version 1,
    # so Flyway skips migrations with version <= 1. First schema script is therefore V2.
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}

  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:ecommerce-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

storage:
  provider: ${STORAGE_PROVIDER:local}
  allowed-extensions: jpg,jpeg,png,webp,gif,pdf
  allowed-mime-types: image/jpeg,image/png,image/webp,image/gif,application/pdf
  max-size: 10485760
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  local:
    root-dir: ${STORAGE_LOCAL_ROOT:./data/storage}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8087}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.ecommerce.storageservice: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
