server:
  port: ${SERVER_PORT:8087}
  servlet:
    context-path: /

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: storage-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}

  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:ecommerce-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

app:
  storage:
    provider: ${STORAGE_PROVIDER:local}
    allowed-extensions: jpg,jpeg,png,webp,gif
    max-size: 10485760
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:ecommerce}
    local:
      root-dir: ${STORAGE_LOCAL_ROOT:./data/storage}
      public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8087/api/storage/files}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.ecommerce.storageservice: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
